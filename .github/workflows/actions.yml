name: install-and-test-workflow

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: 0.9
  PYTHON_VERSION: 3.11
  UV_SYSTEM_PYTHON: true
  NODE_VERSION: 26

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
          version: ${{ env.UV_VERSION }}
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
          python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: |
        uv sync --all-extras
    - name: Test with pytest
      run: |
        uv run --with coverage coverage run -m pytest -sv
    - name: Submit to coveralls
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run --with coveralls coveralls --service=github

  dashboard-scripts:
    # Type checking and tests of the dashboard's browser code (package.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ruff-linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
      - run: ruff check .
      # Uncomment the following line to enable format check
      # - run: ruff format --check .
